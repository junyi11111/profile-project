          label: "이메일 보내기"

  # About
  about:
    enable: true
    title: "소개"
    content: |-
      #### 관심 분야: 네트워크

      컴퓨터네트워크와 운영체제 과목을 들으며 네트워크에 흥미가 생겼습니다. 눈에 보이지 않는 곳에서 정보가 나름의 체계를 이루며 전달되는 과정이 신기했고, 환경마다 최적의 체계가 있을 것 같아 더 알고 싶어졌습니다.

      #### 학습 목표와 다음 행동

      **목표** — MAC 계층 내용을 더 이해해서 제 설계를 구체화하는 것

      **다음 행동** — 구현 프로그램(OMNeT++)을 익숙하게 다루며 실험을 이어 나가기

      #### 역량과 사례

      **OMNeT++** — 비교 논문의 설계를 시뮬레이터에서 같은 방식으로 구현하며 사용하고 있습니다.
    skills:
      enable: false

  # Experience
  experience:
    enable: true
    title: "경력"
    items:
      - company: "전북대학교 공과대학"
        jobs:
          - name: "학부연구생"
            date: "2026년 7월 ~ 현재 (진행 중)"
            content: "연구실에서 교수님 지도 아래 MAC 환경에서 충돌을 줄이면서 안전하게 전달할 수 있는 방법을 연구하고 있습니다."

  # Education
  education:
    enable: true
    title: "학력"
    index: false
    items:
