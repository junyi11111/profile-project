  # projects
  projects:
    enable: true
    title: "대표 활동"
    items:
      - title: "학부연구생으로 MAC 문제 연구"
        content: "2026년 7월부터 진행 중. MAC 환경에서 충돌을 줄이면서 안전하게 전달할 수 있는 방법을 OMNeT++ 실험으로 연구하고 있습니다."
        image: /images/projects/omnet-run.png
        imageAlt: "OMNeT++ Qtenv 창에서 시뮬레이션을 실행 중인 화면. 네트워크 서버, 라우터, 인터넷 클라우드, 게이트웨이와 여러 무선 노드로 이루어진 네트워크 구성도가 보인다."
